name: Firebase dev Hosting
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  # All dev-to-main releases share the dev live site. Other PRs stay isolated.
  group: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'dev' && github.base_ref == 'main' && 'hosting-dev-live' || format('hosting-pr-{0}', github.event.number) }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Dev live reflects the pushed dev commit; other PRs test the merge ref.
          ref: ${{ github.head_ref == 'dev' && github.base_ref == 'main' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
      - run: flutter pub get --enforce-lockfile
      - run: node scripts/check_generated.mjs --tracked
      - run: node scripts/check_repository.mjs
      - run: node scripts/check_architecture.mjs
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test --coverage --test-randomize-ordering-seed=4729
      - run: node scripts/check_coverage.mjs
      - run: node --test scripts/tests/*_test.mjs
      - run: flutter test --platform chrome test/browser/matrix_browser_clipboard_test.dart
      - name: Install matching browser test driver
        run: |
          CHROME_VERSION=$(google-chrome --product-version)
          DRIVER=$(npx --yes @puppeteer/browsers@3.2.6 install "chromedriver@$CHROME_VERSION" --path build/browser | tail -n 1)
          echo "CHROMEDRIVER=${DRIVER#* }" >> "$GITHUB_ENV"
      - run: node scripts/run_web_integration.mjs
      - run: node scripts/run_web_integration.mjs
        env:
          BROWSER_DIMENSION: '390x844'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm --prefix security-tests ci --ignore-scripts
      - run: npm --prefix security-tests audit --audit-level=high
      - run: node scripts/run_rules_tests.mjs
      - name: Verify Firebase SDK contracts on isolated emulators
        run: >-
          sh scripts/firebase_emulators.sh emulators:exec
          --config firebase.emulators.json --only auth,firestore
          --project demo-bramwellsprecisiontestkit
          'node scripts/flutter.mjs local test --platform chrome test/emulators/firebase_emulators_test.dart'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            coverage/lcov.info
            build/coverage-report.json
            build/test-results
          retention-days: 7
      - run: node scripts/build_web.mjs dev
      - run: node scripts/run_hosting_test.mjs dev
      - run: node scripts/measure_web.mjs dev
      - uses: actions/upload-artifact@v4
        if: github.event.repository.private
        with:
          name: private-symbols-dev
          path: build/private-symbols/dev
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: web-dev
          path: build/web-dev
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dev-transfer-report
          path: build/web-transfer-dev.json
          retention-days: 2

  deploy:
    needs: validate
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref == 'dev' && github.base_ref == 'main' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: web-dev
          path: build/web-dev
      - run: node scripts/check_web_release.mjs dev
      - name: Check deployment credential project
        env:
          DEPLOY_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRAMWELLSPRECISIONTESTKITDEV }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          value = os.environ.get("DEPLOY_CREDENTIAL", "")
          if not value:
              sys.exit("Configure the dev Firebase service-account secret before deploying.")
          if json.loads(value).get("project_id") != "bramwellsprecisiontestkitdev":
              sys.exit("Deployment credential belongs to the wrong Firebase project.")
          PYTHON
      - run: cp firebase.dev.json firebase.json
      - name: Deploy dev live
        if: ${{ github.head_ref == 'dev' && github.base_ref == 'main' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRAMWELLSPRECISIONTESTKITDEV }}
          channelId: live
          projectId: bramwellsprecisiontestkitdev
      # Other same-repository PRs get isolated files with dev Auth/Firestore.
      - name: Deploy PR preview
        if: ${{ github.head_ref != 'dev' || github.base_ref != 'main' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRAMWELLSPRECISIONTESTKITDEV }}
          channelId: pr-${{ github.event.number }}
          expires: 2d
          projectId: bramwellsprecisiontestkitdev
