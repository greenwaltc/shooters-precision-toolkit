name: Firebase dev Hosting
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  # All dev-to-main releases share the dev live site. Other PRs stay isolated.
  group: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'dev' && github.base_ref == 'main' && 'hosting-dev-live' || format('hosting-pr-{0}', github.event.number) }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/web-ci.yml
    with:
      environment: dev
      checkout_ref: ${{ github.head_ref == 'dev' && github.base_ref == 'main' && github.event.pull_request.head.sha || github.sha }}
      schema_base: ${{ github.event.pull_request.base.sha }}

  # Keep the required branch-protection check stable. Any failed, skipped or
  # cancelled validation prevents deployment of the independently built artifact.
  validate:
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success

  deploy:
    needs: validate
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref == 'dev' && github.base_ref == 'main' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: web-dev
          path: build/web-dev
      - run: node scripts/check_web_release.mjs dev
      - name: Check deployment credential project
        env:
          DEPLOY_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRAMWELLSPRECISIONTESTKITDEV }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          value = os.environ.get("DEPLOY_CREDENTIAL", "")
          if not value:
              sys.exit("Configure the dev Firebase service-account secret before deploying.")
          if json.loads(value).get("project_id") != "bramwellsprecisiontestkitdev":
              sys.exit("Deployment credential belongs to the wrong Firebase project.")
          PYTHON
      - run: cp firebase.dev.json firebase.json
      - name: Deploy dev live
        if: ${{ github.head_ref == 'dev' && github.base_ref == 'main' }}
        uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRAMWELLSPRECISIONTESTKITDEV }}
          channelId: live
          projectId: bramwellsprecisiontestkitdev
      # Other same-repository PRs get isolated files with dev Auth/Firestore.
      - name: Deploy PR preview
        if: ${{ github.head_ref != 'dev' || github.base_ref != 'main' }}
        uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRAMWELLSPRECISIONTESTKITDEV }}
          channelId: pr-${{ github.event.number }}
          expires: 2d
          projectId: bramwellsprecisiontestkitdev
