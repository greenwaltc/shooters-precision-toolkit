name: Release Firebase production
# Production deployment remains manual, main-only, and environment-protected.
# validate_only also exercises the prod validation graph on a development branch.
on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Run production checks without deployment (allowed on dev).
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ inputs.validate_only && format('hosting-production-check-{0}', github.ref) || 'hosting-production' }}
  cancel-in-progress: ${{ inputs.validate_only }}

jobs:
  checks:
    if: github.ref == 'refs/heads/main' || inputs.validate_only
    uses: ./.github/workflows/web-ci.yml
    with:
      environment: prod
      checkout_ref: ${{ github.sha }}

  validate:
    if: always() && (github.ref == 'refs/heads/main' || inputs.validate_only)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && !inputs.validate_only
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://bramwelltest.com
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: web-prod
          path: build/web-prod
      - run: node scripts/check_web_release.mjs prod
      - name: Check deployment credential project
        env:
          DEPLOY_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRAMWELLS_PRECISION_TEST_KIT }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          value = os.environ.get("DEPLOY_CREDENTIAL", "")
          if not value:
              sys.exit("Configure the production Firebase service-account secret before deploying.")
          if json.loads(value).get("project_id") != "bramwells-precision-test-kit":
              sys.exit("Deployment credential belongs to the wrong Firebase project.")
          PYTHON
      - run: cp firebase.prod.json firebase.json
      - uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRAMWELLS_PRECISION_TEST_KIT }}
          channelId: live
          projectId: bramwells-precision-test-kit
