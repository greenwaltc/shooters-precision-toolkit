# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment credential project
        env:
          DEPLOY_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRAMWELLS_PRECISION_TEST_KIT }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          value = os.environ.get("DEPLOY_CREDENTIAL", "")
          if not value:
              sys.exit("Configure the FIREBASE_SERVICE_ACCOUNT_BRAMWELLS_PRECISION_TEST_KIT GitHub Actions secret before deploying.")
          if json.loads(value).get("project_id") != "bramwells-precision-test-kit":
              sys.exit("Deployment credential belongs to the wrong Firebase project.")
          PYTHON
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=APP_ENV=prod --output=build/web-prod
      - run: cp firebase.prod.json firebase.json
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRAMWELLS_PRECISION_TEST_KIT }}
          channelId: live
          projectId: bramwells-precision-test-kit
