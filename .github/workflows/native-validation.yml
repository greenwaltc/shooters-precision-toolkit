name: Native validation
on:
  pull_request:
    paths:
      - '.github/workflows/native-validation.yml'
      - '.github/actions/**'
      - 'android/**'
      - 'ios/**'
      - 'macos/**'
      - 'assets/**'
      - 'config/**'
      - 'lib/**'
      - 'scripts/**'
      - 'pubspec.*'
      - 'l10n.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-flutter
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          # Writes remain scoped to this PR; forks cannot replace main's cache.
          cache-read-only: false
      # Keep flavors together: prod reuses dev's compiled native dependencies.
      - run: node scripts/flutter.mjs dev build apk --debug --flavor dev --no-pub
      - run: node scripts/flutter.mjs prod build apk --debug --flavor prod --no-pub

  apple:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
        platform: [ios, macos]
    env:
      APP_PROFILE: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-flutter
      - name: Identify Xcode toolchain
        id: xcode
        run: |
          xcodebuild -version
          echo "hash=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore CocoaPods and incremental native compilation
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ${{ matrix.platform }}/Pods
            build/${{ matrix.platform == 'ios' && 'ios' || 'macos-unsigned' }}
          key: apple-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ matrix.environment }}-${{ steps.xcode.outputs.hash }}-${{ hashFiles('config/toolchain.json', 'pubspec.lock', 'ios/Podfile.lock', 'macos/Podfile.lock') }}-${{ github.sha }}
          restore-keys: |
            apple-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ matrix.environment }}-${{ steps.xcode.outputs.hash }}-${{ hashFiles('config/toolchain.json', 'pubspec.lock', 'ios/Podfile.lock', 'macos/Podfile.lock') }}-
      - run: node scripts/check_native_config.mjs
      - if: matrix.platform == 'ios'
        run: node scripts/flutter.mjs "$APP_PROFILE" build ios --simulator --debug --no-codesign --flavor "$APP_PROFILE" --no-pub
      - if: matrix.platform == 'macos'
        run: node scripts/flutter.mjs "$APP_PROFILE" build macos --debug --config-only --flavor "$APP_PROFILE" --no-pub
      - if: matrix.platform == 'macos'
        run: >-
          xcodebuild -quiet -workspace macos/Runner.xcworkspace
          -scheme "$APP_PROFILE" -configuration "Debug-$APP_PROFILE"
          -derivedDataPath build/macos-unsigned CODE_SIGNING_ALLOWED=NO build
