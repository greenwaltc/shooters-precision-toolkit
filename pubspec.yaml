name: bramwells_precision_test_kit
description: "Bramwell's Precision Test Kit — Copyright © 2026 Denton M. Bramwell. All rights reserved. Proprietary software."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4
  flutter: '>=3.47.9'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  intl: ^0.20.3
  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0
  file_picker: ^11.0.2
  flutter_markdown_plus: ^1.0.7
  image: ^4.8.0
  pdf: ^3.12.0
  pluto_grid: ^8.1.0
  provider: ^6.1.5
  clock: ^1.1.2
  shared_preferences: ^2.5.5
  web: ^1.1.1
  url_launcher: ^6.3.2
  firebase_core: ^4.15.2
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

dev_dependencies:
  integration_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  # Browser smoke tests register real plugins; widget tests do not auto-register them.
  firebase_core_web: ^3.12.0
  firebase_auth_web: ^6.3.0
  cloud_firestore_web: ^5.7.3
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  msix: ^3.18.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/help_instructions.md
    - assets/help/test_design/en/
    - assets/projects_banner_logo.png
    - assets/icon/app_icon_compact.png
    - assets/img/target_bg.png

# Regenerate platform launcher icons after replacing assets/icon/app_icon.png:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  macos:
    generate: true
  windows:
    generate: true
  remove_alpha_ios: true
  background_color_ios: "#000000"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/icon/app_icon.png
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#000000"
    theme_color: "#000000"

msix_config:
  display_name: "Bramwell's Precision Test Kit"
  publisher_display_name: "Noremac9"
  identity_name: "Noremac9.BramwellsPrecisionTestKit"
  publisher: "CN=66EC1A2D-375B-4035-8E74-7F7530CB5F93"
  msix_version: 1.0.0.0
  logo_path: assets/icon/app_icon.png
  architecture: x64
  capabilities: internetClient
  store: true
  output_path: build/store
  output_name: BramwellsPrecisionTestKit_1.0.0.0_x64
