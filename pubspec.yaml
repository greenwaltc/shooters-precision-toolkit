name: bramwells_precision_test_kit
description: "Bramwell's Precision Test Kit — Copyright © 2026 Denton M. Bramwell. All rights reserved. Proprietary software."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0
  file_picker: ^11.0.2
  flutter_markdown_plus: ^1.0.7
  flutter_svg: ^2.2.4
  image: ^4.8.0
  pdf: ^3.12.0
  pluto_grid: ^8.1.0
  provider: ^6.1.5
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/help_instructions.md
    - assets/projects_banner_logo.png
    - assets/icon/app_icon.png

# Regenerate platform launcher icons after replacing assets/icon/app_icon.png:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  macos:
    generate: true
  windows:
    generate: true
  remove_alpha_ios: true
  background_color_ios: "#000000"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/icon/app_icon.png
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#000000"
    theme_color: "#000000"
