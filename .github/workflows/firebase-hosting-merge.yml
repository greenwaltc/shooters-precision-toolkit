name: Release Firebase production
# Run from Actions after merging to main. Add required reviewers and a main-only
# deployment rule to the GitHub "production" environment before the first release.
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: hosting-production
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
      - run: flutter pub get --enforce-lockfile
      - name: Generate Dart localizations from the checked-out ARB
        run: flutter gen-l10n
      - run: node scripts/check_repository.mjs
      - run: node scripts/check_architecture.mjs
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test --coverage --test-randomize-ordering-seed=4729
      - run: node scripts/check_coverage.mjs
      - run: node --test scripts/tests/*_test.mjs
      - run: flutter test --platform chrome test/browser/matrix_browser_clipboard_test.dart
      - name: Install matching browser test driver
        run: |
          CHROME_VERSION=$(google-chrome --product-version)
          DRIVER=$(npx --yes @puppeteer/browsers@3.2.6 install "chromedriver@$CHROME_VERSION" --path build/browser | tail -n 1)
          echo "CHROMEDRIVER=${DRIVER#* }" >> "$GITHUB_ENV"
      - run: node scripts/run_web_integration.mjs
      - run: node scripts/run_web_integration.mjs
        env:
          BROWSER_DIMENSION: '390x844'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm --prefix security-tests ci --ignore-scripts
      - run: npm --prefix security-tests audit --audit-level=high
      - run: node scripts/run_rules_tests.mjs
      - name: Verify Firebase SDK contracts on isolated emulators
        run: >-
          sh scripts/firebase_emulators.sh emulators:exec
          --config firebase.emulators.json --only auth,firestore
          --project demo-bramwellsprecisiontestkit
          'node scripts/flutter.mjs local test --platform chrome test/emulators/firebase_emulators_test.dart'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            coverage/lcov.info
            build/coverage-report.json
            build/test-results
          retention-days: 7
      - run: node scripts/build_web.mjs prod
      - run: node scripts/run_hosting_test.mjs prod
      - run: node scripts/measure_web.mjs prod
      - uses: actions/upload-artifact@v4
        if: github.event.repository.private
        with:
          name: private-symbols-prod
          path: build/private-symbols/prod
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: web-prod
          path: build/web-prod
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: prod-transfer-report
          path: build/web-transfer-prod.json
          retention-days: 2

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://bramwelltest.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: web-prod
          path: build/web-prod
      - run: node scripts/check_web_release.mjs prod
      - name: Check deployment credential project
        env:
          DEPLOY_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRAMWELLS_PRECISION_TEST_KIT }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          value = os.environ.get("DEPLOY_CREDENTIAL", "")
          if not value:
              sys.exit("Configure the production Firebase service-account secret before deploying.")
          if json.loads(value).get("project_id") != "bramwells-precision-test-kit":
              sys.exit("Deployment credential belongs to the wrong Firebase project.")
          PYTHON
      - run: cp firebase.prod.json firebase.json
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRAMWELLS_PRECISION_TEST_KIT }}
          channelId: live
          projectId: bramwells-precision-test-kit
