name: Firebase dev preview
on: pull_request
permissions:
  contents: read
concurrency:
  group: hosting-pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: node --test scripts/tests/web_release_test.mjs
      - run: node scripts/build_web.mjs dev
      - run: node scripts/measure_web.mjs dev
      - uses: actions/upload-artifact@v4
        with:
          name: web-dev
          path: build/web-dev
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dev-transfer-report
          path: build/web-transfer-dev.json
          retention-days: 2

  preview:
    needs: validate
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: web-dev
          path: build/web-dev
      - run: node scripts/check_web_release.mjs dev
      - name: Check deployment credential project
        env:
          DEPLOY_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRAMWELLSPRECISIONTESTKITDEV }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          value = os.environ.get("DEPLOY_CREDENTIAL", "")
          if not value:
              sys.exit("Configure the dev Firebase service-account secret before deploying.")
          if json.loads(value).get("project_id") != "bramwellsprecisiontestkitdev":
              sys.exit("Deployment credential belongs to the wrong Firebase project.")
          PYTHON
      - run: cp firebase.dev.json firebase.json
      # Previews isolate Hosting content; each app still uses dev Auth/Firestore.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRAMWELLSPRECISIONTESTKITDEV }}
          channelId: pr-${{ github.event.number }}
          expires: 2d
          projectId: bramwellsprecisiontestkitdev
